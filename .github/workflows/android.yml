name: 构建 Android APK
on:
  push:
    branches: [main, master]
    tags: ['v*']            # 打 v 开头的标签 = 出一个冻结版本 Release
  workflow_dispatch:

# gh release create 需要写权限（Releases 归 contents 管）
permissions:
  contents: write

jobs:
  # 先跑检查，不过就不出包。以前 CI 一条测试都没跑：README 上挂着"回归测试 249 项"的徽章，
  # 但云构建里根本没这一步 —— 一条会弄坏 249 项断言的 push 照样发布 APK。
  # 这些脚本都是无依赖的纯 Node / bash，所以连 npm install 都不需要。
  checks:
    name: 回归与静态检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 逻辑回归（vm 沙箱跑浏览器模块）
        run: node _tools/test-logic.mjs

      - name: DOM 接线审计 / 跨模块引用对账
        run: |
          node _tools/audit-wiring.mjs
          node _tools/xref.mjs

      - name: 发布说明抽取（含负向对照）
        run: bash _tools/notes-extract.sh

      - name: 鸿蒙工程静态审计
        # 没人能在 CI 里编 HAP（工具链要华为账号登录、hvigor 不公开分发），
        # 所以这是鸿蒙侧唯一的自动防线：rawfile 与 www 一致性、资源引用、
        # 身份版本、有没有裸用 confirm/prompt（ArkWeb 无默认弹框会静默失效）。
        run: |
          node _tools/sync-www.mjs
          node _tools/audit-harmony.mjs

  apk:
    name: Debug APK（云构建，本机无需 Android SDK）
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 安装 Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'

      - name: 安装依赖
        run: npm install

      - name: 生成 Android 工程
        run: npx --yes cap add android

      - name: 同步 web 资源到 android/
        run: npx --yes cap sync android

      - name: 用 assets/icon.png 生成图标与开屏图
        # 包名是 @capacitor/assets（不是 capacitor-assets）；本机因为 sharp 装不上
        # 已把它移出依赖，CI 上临时拉取即可。图标生成失败不该拖垮 APK 产物，
        # 所以 continue-on-error：最坏情况用 Capacitor 默认图标出包。
        continue-on-error: true
        run: npx --yes @capacitor/assets@3 generate --android

      - name: 修正 Android 工程（版本 / 明文许可 / 应用身份）
        # 这些都不属于 www，也不属于 capacitor.config.json，cap add/sync 不会替我们写。
        # 以前本机脚本和这里各抄一份 sed，CI 那份漏了 usesCleartextTraffic，
        # 结果 Releases 下载的包连不上本地 http 端点、本机的却可以——两条路线漂移。
        # 现在两边都调同一个脚本，实现只有一份。
        run: |
          set -euo pipefail
          node _tools/prepare-android.mjs
          grep -E 'versionName ' android/app/build.gradle | sed 's/^/   /'
          grep -o 'usesCleartextTraffic="true"' android/app/src/main/AndroidManifest.xml | sed 's/^/   /'

      - name: 编译 APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: noadic-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: 发布到 GitHub Release
        # 普通 push → 滚动预发布版 latest-debug（每次覆盖同一个资产，永远指向最新构建）
        # 推 v* 标签 → 建一个正式的冻结版本 Release
        # 用 runner 自带的 gh CLI，不引入第三方 action。
        env:
          GH_TOKEN: ${{ github.token }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK" || { echo "::error::找不到 APK：$APK"; exit 1; }
          SHORT=$(git rev-parse --short HEAD)
          SIZE=$(du -h "$APK" | cut -f1)

          # 发布说明的正文来自 CHANGELOG.md 对应版本那一段 —— 更新日志只有一份，
          # Release 上的字不能和仓库里的字各说各话。标签 v1.2.0 对应 [1.2.0]。
          if [ "$REF_TYPE" = "tag" ]; then WANT="${REF_NAME#v}"; else WANT=$(node -p "require('./package.json').version"); fi
          NOTES="$RUNNER_TEMP/release-notes.md"
          {
            if [ -f CHANGELOG.md ]; then
              awk -v want="$WANT" '/^## /{ p = (index($0, "[" want "]") > 0); next } p{ print }' CHANGELOG.md > "$NOTES.part" || true
            else
              : > "$NOTES.part"
            fi
            if [ -s "$NOTES.part" ]; then
              cat "$NOTES.part"
            else
              echo "CHANGELOG.md 里没有 $WANT 这一段（滚动调试版常见），下面这些信息为准。"
            fi
            echo
            echo "---"
            echo
            echo "构建自 \`$REF_NAME@${SHORT}\`，APK ${SIZE}。"
            echo
            echo "装法：手机直接安装；覆盖旧版本不会丢数据（词库、学习进度、错题本都在应用本地存储里，debug 签名一致）。"
            echo
            echo "⚠️ debug 签名仅供自用，不要拿去上架。"
            echo
            echo "本次构建日志：${RUN_URL}"
          } > "$NOTES"
          echo "发布说明取自 CHANGELOG（$WANT），共 $(wc -l < "$NOTES") 行"

          if [ "$REF_TYPE" = "tag" ]; then
            TAG="$REF_NAME"
            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "Release $TAG 已存在，覆盖其 APK 资产"
              gh release edit "$TAG" --title "noadic $TAG" --notes-file "$NOTES"
              gh release upload "$TAG" "$APK" --clobber
            else
              gh release create "$TAG" "$APK" --title "noadic $TAG" --notes-file "$NOTES"
            fi
          else
            TAG=latest-debug
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release edit "$TAG" --title "最新调试版 APK（每次 push 自动更新）" --notes-file "$NOTES"
              gh release upload "$TAG" "$APK" --clobber
              # 滚动 tag 会停在第一次的提交上，导致 Release 的 Source code 指向旧代码：把 tag 挪到 HEAD
              gh api --method PATCH "repos/${{ github.repository }}/git/refs/tags/$TAG" \
                -f sha="${{ github.sha }}" -F force=true >/dev/null 2>&1 \
                || echo "::warning::滚动 tag 未能移动（仅 APK 已更新，不影响安装）"
            else
              gh release create "$TAG" "$APK" \
                --title "最新调试版 APK（每次 push 自动更新）" \
                --prerelease --notes-file "$NOTES"
            fi
          fi
          echo "✅ 已发布： ${{ github.server_url }}/${{ github.repository }}/releases/tag/$TAG"
          # gh 的字段名是 isPrerelease（不是 prerelease），写错会被 set -e 判成整步失败；
          # 诊断信息不该有权搞红构建，所以再兜一层 || true。
          gh release view "$TAG" --json tagName,isPrerelease,assets \
            --jq '"   资产: " + (.assets | map(.name + " " + (.size | tostring) + " B") | join(", "))' \
            || echo "（资产列表打印失败，不影响发布本身）"
