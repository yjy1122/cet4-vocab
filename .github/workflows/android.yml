name: 构建 Android APK
on:
  push:
    branches: [main, master]
    tags: ['v*']            # 打 v 开头的标签 = 出一个冻结版本 Release
  workflow_dispatch:

# gh release create 需要写权限（Releases 归 contents 管）
permissions:
  contents: write

jobs:
  apk:
    name: Debug APK（云构建，本机无需 Android SDK）
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 安装 Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'

      - name: 安装依赖
        run: npm install

      - name: 生成 Android 工程
        run: npx --yes cap add android

      - name: 同步 web 资源到 android/
        run: npx --yes cap sync android

      - name: 用 assets/icon.png 生成图标与开屏图
        # 包名是 @capacitor/assets（不是 capacitor-assets）；本机因为 sharp 装不上
        # 已把它移出依赖，CI 上临时拉取即可。图标生成失败不该拖垮 APK 产物，
        # 所以 continue-on-error：最坏情况用 Capacitor 默认图标出包。
        continue-on-error: true
        run: npx --yes @capacitor/assets@3 generate --android

      - name: 编译 APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: noadic-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: 发布到 GitHub Release
        # 普通 push → 滚动预发布版 latest-debug（每次覆盖同一个资产，永远指向最新构建）
        # 推 v* 标签 → 建一个正式的冻结版本 Release
        # 用 runner 自带的 gh CLI，不引入第三方 action。
        env:
          GH_TOKEN: ${{ github.token }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK" || { echo "::error::找不到 APK：$APK"; exit 1; }
          SHORT=$(git rev-parse --short HEAD)
          SIZE=$(du -h "$APK" | cut -f1)
          NOTES="构建自 \`${REF_NAME}@${SHORT}\`，APK ${SIZE}。

          装法：手机直接安装；覆盖旧版本不会丢数据（学习记录、词库、错题本都在应用本地存储里，debug 签名一致）。

          ⚠️ debug 签名仅供自用，不要拿去上架。

          本次构建日志：${RUN_URL}"
          if [ "$REF_TYPE" = "tag" ]; then
            TAG="$REF_NAME"
            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "Release $TAG 已存在，覆盖其 APK 资产"
              gh release edit "$TAG" --title "noadic $TAG" --notes "$NOTES"
              gh release upload "$TAG" "$APK" --clobber
            else
              gh release create "$TAG" "$APK" --title "noadic $TAG" --notes "$NOTES"
            fi
          else
            TAG=latest-debug
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release edit "$TAG" --title "最新调试版 APK（每次 push 自动更新）" --notes "$NOTES"
              gh release upload "$TAG" "$APK" --clobber
              # 滚动 tag 会停在第一次的提交上，导致 Release 的 Source code 指向旧代码：把 tag 挪到 HEAD
              gh api --method PATCH "repos/${{ github.repository }}/git/refs/tags/$TAG" \
                -f sha="${{ github.sha }}" -F force=true >/dev/null 2>&1 \
                || echo "::warning::滚动 tag 未能移动（仅 APK 已更新，不影响安装）"
            else
              gh release create "$TAG" "$APK" \
                --title "最新调试版 APK（每次 push 自动更新）" \
                --prerelease --notes "$NOTES"
            fi
          fi
          echo "✅ 已发布： ${{ github.server_url }}/${{ github.repository }}/releases/tag/$TAG"
          # gh 的字段名是 isPrerelease（不是 prerelease），写错会被 set -e 判成整步失败；
          # 诊断信息不该有权搞红构建，所以再兜一层 || true。
          gh release view "$TAG" --json tagName,isPrerelease,assets \
            --jq '"   资产: " + (.assets | map(.name + " " + (.size | tostring) + " B") | join(", "))' \
            || echo "（资产列表打印失败，不影响发布本身）"
